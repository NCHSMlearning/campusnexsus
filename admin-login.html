<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CampusNexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0A3D62 0%, #052e1f 50%, #0A1628 100%);
            padding: 20px;
        }

        .login-container {
            background: #fff;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            color: #0A3D62;
            margin-bottom: 4px;
        }

        .login-container .logo span {
            color: #10b981;
        }

        .login-container .logo small {
            display: block;
            font-size: 0.7rem;
            font-weight: 400;
            color: #94a3b8;
            margin-top: 2px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 1;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #f8fafc;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #10b981;
        }

        .form-options a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-signup {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: transparent;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-signup:hover {
            border-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .success-message.show {
            display: flex;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 20px;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo -->
        <div class="logo">
            Campus<span>Nexus</span>
            <small>Admin Dashboard</small>
        </div>
        <p class="subtitle">Sign in to manage your platform</p>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Invalid credentials</span>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <span id="successText">Account created successfully! Please sign in.</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="admin@campusnexus.com" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe" checked> Remember me
                </label>
                <a href="#" onclick="showForgotPassword()">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="loginBtnText">Sign In</span>
            </button>
        </form>

        <div class="divider">or</div>

        <!-- Sign Up Button -->
        <button class="btn-signup" onclick="showSignup()">
            <i class="fas fa-user-plus"></i> Create New Account
        </button>
    </div>

    <!-- ============================================================
         SUPABASE CONFIG - FIXED
         ============================================================ -->
    <script>
        // ============================================================
        // SUPABASE CONFIGURATION
        // ============================================================
        const SUPABASE_URL = 'https://irahplkvocaakjxuisto.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyYWhwbGt2b2NhYWtqeHVpc3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODY5ODQsImV4cCI6MjEwMzQ2Mjk4NH0.BFOwdRVDz4r1oYgUjm8zQbthqblGRq4c3WQWQaOhu7g';

        // Initialize Supabase client - use a different variable name to avoid conflicts
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================================
        // STATE
        // ============================================================
        let isSignupMode = false;

        // ============================================================
        // HANDLE LOGIN
        // ============================================================
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');

            errorMessage.classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');

            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }

            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="loading-spinner"></span> Signing in...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error('Auth error:', error);
                    
                    if (error.message.includes('Invalid login credentials')) {
                        showError('Invalid email or password. Please try again.');
                    } else if (error.message.includes('Email not confirmed')) {
                        showError('Please confirm your email address first.');
                    } else {
                        showError(error.message || 'Login failed. Please try again.');
                    }
                    resetButton();
                    return;
                }

                const user = data.user;

                const { data: profile, error: profileError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (profileError && profileError.code !== 'PGRST116') {
                    console.error('Profile error:', profileError);
                }

                const session = {
                    id: user.id,
                    email: user.email,
                    name: profile?.name || user.email?.split('@')[0] || 'Admin',
                    role: profile?.role || 'admin',
                    loggedInAt: new Date().toISOString(),
                    accessToken: data.session?.access_token
                };

                localStorage.setItem('campusnexus_admin', JSON.stringify(session));

                if (rememberMe) {
                    localStorage.setItem('campusnexus_remember', 'true');
                }

                window.location.href = 'admin-dashboard.html';

            } catch (error) {
                console.error('Login error:', error);
                showError('An unexpected error occurred. Please try again.');
                resetButton();
            }
        }

        // ============================================================
        // SHOW SIGNUP
        // ============================================================
        function showSignup() {
            const subtitle = document.querySelector('.subtitle');
            const form = document.getElementById('loginForm');
            const btnSignup = document.querySelector('.btn-signup');

            if (isSignupMode) {
                isSignupMode = false;
                subtitle.textContent = 'Sign in to manage your platform';
                form.querySelector('button[type="submit"]').innerHTML = '<i class="fas fa-sign-in-alt"></i> <span id="loginBtnText">Sign In</span>';
                btnSignup.innerHTML = '<i class="fas fa-user-plus"></i> Create New Account';
                document.querySelector('.form-options').style.display = 'flex';
                
                const nameGroup = document.getElementById('nameGroup');
                if (nameGroup) nameGroup.remove();
            } else {
                isSignupMode = true;
                subtitle.textContent = 'Create a new admin account';
                form.querySelector('button[type="submit"]').innerHTML = '<i class="fas fa-user-plus"></i> <span id="loginBtnText">Create Account</span>';
                btnSignup.innerHTML = '<i class="fas fa-sign-in-alt"></i> Back to Sign In';
                document.querySelector('.form-options').style.display = 'none';

                const nameGroup = document.createElement('div');
                nameGroup.className = 'form-group';
                nameGroup.id = 'nameGroup';
                nameGroup.innerHTML = `
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" placeholder="Your full name" required>
                    </div>
                `;
                form.insertBefore(nameGroup, form.querySelector('.form-group:not(#nameGroup)'));
            }
        }

        // ============================================================
        // HANDLE SIGNUP
        // ============================================================
        async function handleSignup(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            if (!name || !email || !password) {
                showError('Please fill in all fields.');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="loading-spinner"></span> Creating account...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: name,
                            role: 'admin'
                        }
                    }
                });

                if (error) {
                    if (error.message.includes('User already registered')) {
                        showError('This email is already registered. Please sign in.');
                    } else {
                        showError(error.message || 'Signup failed. Please try again.');
                    }
                    resetButton();
                    return;
                }

                if (data.user) {
                    const { error: profileError } = await supabaseClient
                        .from('users')
                        .insert([
                            {
                                id: data.user.id,
                                email: email,
                                name: name,
                                role: 'admin',
                                is_online: true
                            }
                        ]);

                    if (profileError) {
                        console.error('Profile creation error:', profileError);
                    }
                }

                successText.textContent = 'Account created successfully! You can now sign in.';
                successMessage.classList.add('show');

                setTimeout(() => {
                    if (isSignupMode) {
                        showSignup();
                    }
                    document.getElementById('email').value = email;
                    document.getElementById('password').value = '';
                    resetButton();
                    successMessage.classList.remove('show');
                }, 3000);

            } catch (error) {
                console.error('Signup error:', error);
                showError('An unexpected error occurred. Please try again.');
                resetButton();
            }
        }

        // ============================================================
        // FORM SUBMISSION
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const admin = localStorage.getItem('campusnexus_admin');
            if (admin) {
                try {
                    const session = JSON.parse(admin);
                    if (session && session.id) {
                        window.location.href = 'admin-dashboard.html';
                        return;
                    }
                } catch(e) {}
            }

            const form = document.getElementById('loginForm');
            form.addEventListener('submit', function(e) {
                if (isSignupMode) {
                    handleSignup(e);
                } else {
                    handleLogin(e);
                }
            });

            document.getElementById('email').focus();
        });

        // ============================================================
        // HELPERS
        // ============================================================
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }

        function resetButton() {
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            loginBtn.disabled = false;
            loginBtnText.textContent = isSignupMode ? 'Create Account' : 'Sign In';
        }

        function showForgotPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showError('Please enter your email address first.');
                return;
            }

            if (confirm(`Send password reset email to ${email}?`)) {
                supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/admin-reset-password.html'
                }).then(({ error }) => {
                    if (error) {
                        showError(error.message);
                    } else {
                        const successMessage = document.getElementById('successMessage');
                        const successText = document.getElementById('successText');
                        successText.textContent = 'Password reset email sent! Check your inbox.';
                        successMessage.classList.add('show');
                        setTimeout(() => successMessage.classList.remove('show'), 5000);
                    }
                });
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('errorMessage').classList.remove('show');
                document.getElementById('successMessage').classList.remove('show');
            }
        });

        console.log('🔐 CampusNexus Admin Login');
        console.log('📧 Use real email + password to login');
        console.log('🆕 Click "Create New Account" to sign up');
    </script>
</body>
</html>

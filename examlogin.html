<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d4f"><title>Exam Login | Campus Nexus</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--navy:#102d4f;--teal:#0f8b8d;--gold:#e7ad38;--ink:#172b43;--muted:#718096;--line:#e2eaf1}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#edf3f8,#f8fafc);display:grid;place-items:center;padding:22px}.login-wrap{width:min(100%,440px)}.brand{text-align:center;margin-bottom:24px}.brand-mark{width:58px;height:58px;margin:0 auto 12px;border-radius:17px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:26px;font-weight:800}.brand h1{font-size:23px;color:var(--navy);margin:0}.brand p{font-size:13px;color:var(--muted);margin:7px 0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 20px 55px #102d4f13}.card h2{font-size:21px;margin:0 0 7px;color:var(--navy)}.intro{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 23px}.field{margin:17px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:48px;border:1px solid #d7e1ea;border-radius:10px;padding:0 13px;font:inherit;font-size:14px;outline:none}.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f8b8d18}.password-row{display:flex;gap:8px}.password-row input{flex:1;min-width:0}.toggle{border:1px solid var(--line);background:#f7fafc;border-radius:10px;padding:0 12px;color:var(--navy);font-weight:600;cursor:pointer}.submit{width:100%;height:49px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:700 14px Inter;cursor:pointer;margin-top:7px}.submit:disabled{opacity:.65;cursor:wait}.message{display:none;margin:0 0 14px;padding:11px 12px;border-radius:9px;font-size:12px;line-height:1.5}.message.error{display:block;background:#fff1f1;color:#a52b2b}.message.info{display:block;background:#eef8f7;color:#176c68}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}.foot a{color:var(--teal);text-decoration:none;font-weight:700}.security{display:flex;justify-content:center;gap:7px;align-items:center;color:#718096;font-size:11px;margin-top:17px}@media(max-width:480px){.card{padding:24px 20px}}
</style></head><body><main class="login-wrap"><header class="brand"><div class="brand-mark">CN</div><h1>Campus Nexus</h1><p>Student Examination Centre</p></header><section class="card"><h2>Exam Login</h2><p class="intro">Sign in with your existing Campus Nexus student account to view and access your examinations.</p><div id="message" class="message" role="alert"></div><form id="examLoginForm"><div class="field"><label for="email">Student email address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="Enter your registered email" required></div><div class="field"><label for="password">Password</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="toggle" type="button" id="togglePassword">Show</button></div></div><button class="submit" id="submitBtn" type="submit">Sign in to examinations</button></form><div class="security">▣ Secure sign-in · Existing Campus Nexus account</div></section><footer class="foot">Having trouble signing in? <a href="/login.html">Use the main Campus Nexus login</a><br><br>© 2026 Campus Nexus</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/exam-supabase.js?v=20261120-1"></script><script src="/js/examlogin.js?v=20261120-1"></script></body></html>

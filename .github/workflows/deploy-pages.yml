name: Deploy CampusNexus with Digital Campus source
on:
  push:
    branches: [main]
    # Secure Exam Browser source/build changes do not alter the website.
    # Keep those commits out of the Pages deployment workflow.
    paths-ignore:
      - 'secure-exam-browser/**'
      - '.github/workflows/build-cnseb.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: campusnexus-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and complete Digital Campus source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generate clean student portal routes
        run: |
          test -f platform/student.html
          mkdir -p student platform/student
          cp platform/student.html student/index.html
          cp platform/student.html platform/student/index.html
          # The copied page now lives one directory deeper; make its only
          # relative script reference resolve to the shared platform asset.
          sed -i 's|src="code-protection.js"|src="/platform/code-protection.js"|g' student/index.html platform/student/index.html
          test -s student/index.html
          test -s platform/student/index.html
          echo "Generated /student/ and /platform/student/ from the canonical student portal."
      - name: Verify student examination portal files
        run: |
          test -f studentexam.html
          test -f examlogin.html
          test -f js/student-exams.js
          test -f js/examlogin.js
          test -f css/student-exams.css
          echo "Student examination portal files are present in the Pages artifact."
      - name: Generate canonical Super Admin clean route
        run: |
          test -s platform/superadmin.html
          mkdir -p platform/superadmin
          cat > platform/superadmin/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex">
          <title>Campus Nexus | Super Admin</title>
          <script>
          (function () {
            var target = new URL("/platform/superadmin.html", window.location.origin);
            target.search = window.location.search;
            target.hash = window.location.hash;
            window.location.replace(target.toString());
          })();
          </script>
          </head>
          <body><p>Opening <a href="/platform/superadmin.html">Campus Nexus Super Admin</a>…</p></body>
          </html>
          HTML
          test -s platform/superadmin/index.html
          echo "The clean Super Admin route now opens the canonical platform/superadmin.html dashboard."
      - name: Generate clean URLs and inject global code protection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          pages = [p for p in root.rglob("*.html") if ".git" not in p.parts and "node_modules" not in p.parts]
          created = 0
          for page in pages:
              if page.name.lower() in ("index.html", "404.html"):
                  continue
              route_dir = page.parent / page.stem
              route_index = route_dir / "index.html"
              if route_index.exists():
                  continue
              route_dir.mkdir(parents=True, exist_ok=True)
              html = page.read_text(encoding="utf-8")
              # Rebase relative HTML resource/navigation attributes for the one-level-deeper clean route.
              def rebase(match):
                  attr, quote, value = match.group(1), match.group(2), match.group(3)
                  v = value.strip()
                  if (not v or v.startswith(("/", "#", "?", "//")) or
                      re.match(r"^(?:[a-z][a-z0-9+.-]*:)", v, re.I)):
                      return match.group(0)
                  return f'{attr}={quote}../{v}{quote}'
              html = re.sub(r'\b(src|href|action|poster)=(["\'])(.*?)\2', rebase, html, flags=re.I)
              route_index.write_text(html, encoding="utf-8")
              created += 1

          protection = '<script src="/code-protection.js" defer></script>'
          # Clean URLs are provided by the generated directory/index.html pages.
          # Do not add client-side .html -> /folder/ redirects: they create
          # redirect chains/loops for legacy aliases and nested dashboard routes.
          clean_urls = ""
          injected = 0
          for page in root.rglob("*.html"):
              if ".git" in page.parts or "node_modules" in page.parts:
                  continue
              html = page.read_text(encoding="utf-8")
              changed = False
              has_protection = re.search(r'<script[^>]+src=["\'][^"\']*/code-protection\.js(?:\?[^"\']*)?["\']', html, re.I)
              if not has_protection:
                  html = re.sub(r"</head>", protection + "\n</head>", html, count=1, flags=re.I) if re.search(r"</head>", html, re.I) else protection + html
                  changed = True
              canonical_pages = {
                  "examlogin.html",
                  "exams.html",
                  "platform/examinations/source/adminexams.html"
              }
              relative_path = page.as_posix().lstrip("./")
              if changed:
                  page.write_text(html, encoding="utf-8")
                  injected += 1
          print(f"Generated {created} clean route folders and ensured global code protection in {injected} HTML pages.")
          PY
          test -f code-protection.js
          test -f platform/institution-admin/index.html
          test -f exams/index.html
          grep -Eq 'src="/[^"]*code-protection\.js' platform/institution-admin/index.html
          echo "Clean URLs and global right-click protection are included in the Pages artifact."
      - name: Apply official Campus Nexus logo throughout the website
        run: |
          test -s images/campus-nexus-original-logo.webp
          test -s brand-global.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          brand_script = '<script src="/brand-global.js?v=20261122-campus-nexus-logo-v2" defer></script>'
          updated = 0
          for page in root.rglob("*.html"):
              if ".git" in page.parts or "node_modules" in page.parts:
                  continue
              html = page.read_text(encoding="utf-8")
              if brand_script in html:
                  continue
              if re.search(r"</head>", html, re.I):
                  html = re.sub(r"</head>", brand_script + chr(10) + "</head>", html, count=1, flags=re.I)
              else:
                  html = brand_script + html
              page.write_text(html, encoding="utf-8")
              updated += 1
          print(f"Applied the official Campus Nexus logo script to {updated} HTML pages.")
          PY
          test -s images/campus-nexus-original-logo.webp
          grep -q 'brand-global.js' index.html
          echo "Official Campus Nexus logo branding is included in the Pages artifact."
      - name: Stage pinned signed Android APK on Campus Nexus domain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import urllib.request

          tag = "campus-nexus-app-v1.2.8"
          expected_name = "Campus-Nexus-App-1.2.8.apk"
          api = f"https://api.github.com/repos/NCHSMlearning/campusnexsus/releases/tags/{tag}"
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "CampusNexus-Website-Deployment", "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]}
          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)

          apk = next((item for item in release.get("assets", []) if item.get("name") == expected_name), None)
          if not apk:
              raise SystemExit(f"Pinned release {tag} does not contain {expected_name}; refusing to publish a stale or missing APK.")

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target_dir = workspace / "downloads"
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / "Campus-Nexus-App.apk"
          download_request = urllib.request.Request(apk["browser_download_url"], headers={"User-Agent": "CampusNexus-Website-Deployment"})
          with urllib.request.urlopen(download_request, timeout=180) as response, target.open("wb") as output:
              shutil.copyfileobj(response, output)

          if not target.exists() or target.stat().st_size < 1_000_000:
              raise SystemExit("Pinned APK mirror is missing or unexpectedly small.")
          signature = target.open("rb").read(2)
          if signature != b"PK":
              raise SystemExit("Pinned download is not a valid APK/ZIP payload.")
          versioned_target = target_dir / expected_name
          shutil.copyfile(target, versioned_target)
          print(f"Staged exact release {tag}: {expected_name} ({versioned_target.stat().st_size} bytes)")
          PY
          test -s "$GITHUB_WORKSPACE/downloads/Campus-Nexus-App.apk"
          test -s "$GITHUB_WORKSPACE/downloads/Campus-Nexus-App.apk"
          test "$(stat -c%s "$GITHUB_WORKSPACE/downloads/Campus-Nexus-App.apk")" -gt 1000000
          echo "Verified the pinned v1.2.8 Campus Nexus APK at the established website download route."

      - name: Verify public /app route for GitHub Pages
        run: |
          set -euo pipefail
          test -s app/index.html
          if grep -Eiq 'github\\.com|githubusercontent|NCHSMlearning|campusnexsus' app/index.html; then
            echo "::error::Public /app route contains a repository reference."
            exit 1
          fi
          grep -Fq 'href="/downloads/Campus-Nexus-App.apk"' app/index.html
          echo "Public /app route exists, is repository-neutral, and points to the Campus Nexus APK mirror."

      - name: Inject native Campus Nexus app navigation
        run: |
          set -euo pipefail
          test -s campus-nexus-app-shell.js
          node --check campus-nexus-app-shell.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          tag = '<script src="/campus-nexus-app-shell.js?v=1.2.8" defer></script>'
          changed = 0
          for page in Path(".").rglob("*.html"):
              if ".git" in page.parts or "node_modules" in page.parts:
                  continue
              html = page.read_text(encoding="utf-8")
              if "campus-nexus-app-shell.js" in html:
                  continue
              if re.search(r"</head>", html, re.I):
                  html = re.sub(r"</head>", tag + "\\n</head>", html, count=1, flags=re.I)
              else:
                  html = tag + html
              page.write_text(html, encoding="utf-8")
              changed += 1
          print(f"Enabled native-only app navigation on {changed} HTML pages. The script exits immediately in normal browsers.")
          PY
          grep -q 'campus-nexus-app-shell.js' platform/student.html
          echo "Native app navigation injection verified."

      - name: Upload complete static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub Pages occasionally returns a transient artifact-metadata 404
      # immediately after upload. Keep the artifact in this run and retry the
      # deployment rather than failing a good build.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry GitHub Pages deployment (1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry GitHub Pages deployment (2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify official signed Android APK download
        if: steps.deployment.outcome == 'success' || steps.deployment_retry_1.outcome == 'success' || steps.deployment_retry_2.outcome == 'success'
        run: |
          set -euo pipefail
          release_url="https://github.com/NCHSMlearning/campusnexsus/releases/download/campus-nexus-app-v1.2.8/Campus-Nexus-App-1.2.8.apk"
          echo "Checking official signed APK release asset."
          curl --fail --location --silent --show-error --retry 3 "$release_url" -D /tmp/cn-release-headers.txt -o /tmp/Campus-Nexus-App-release.apk
          test -s /tmp/Campus-Nexus-App-release.apk
          size="$(stat -c%s /tmp/Campus-Nexus-App-release.apk)"
          test "$size" -gt 1000000
          signature="$(head -c 2 /tmp/Campus-Nexus-App-release.apk | od -An -tx1 | tr -d ' \\n')"
          test "$signature" = "504b"
          grep -qi "application/vnd.android.package-archive" /tmp/cn-release-headers.txt
          echo "OFFICIAL RELEASE VERIFIED: HTTP download succeeded; size=$size bytes; APK signature=$signature; Android package MIME type confirmed."

          # Public-facing download page must never expose repository or release-host URLs.
          curl --fail --location --silent --show-error --retry 3 "https://campusnexus.co.ke/app-download" -o /tmp/cn-app-download.html
          if grep -Eiq 'github\\.com|githubusercontent|NCHSMlearning|campusnexsus' /tmp/cn-app-download.html; then
            echo "::error::Public app-download page exposes a repository reference."
            exit 1
          fi
          grep -Fq 'href="/downloads/Campus-Nexus-App.apk"' /tmp/cn-app-download.html
          echo "PUBLIC DOWNLOAD PAGE VERIFIED: no GitHub/repository references; download points to Campus Nexus domain."

          # The custom-domain mirror is optional. A Pages/CDN 404 must not
          # invalidate the known-good signed release asset.
          mirror_url="https://campusnexus.co.ke/downloads/Campus-Nexus-App.apk"
          if curl --fail --location --silent --show-error --retry 2 "$mirror_url" -o /tmp/Campus-Nexus-App-mirror.apk; then
            mirror_size="$(stat -c%s /tmp/Campus-Nexus-App-mirror.apk)"
            test "$mirror_size" -gt 1000000
            test "$(head -c 2 /tmp/Campus-Nexus-App-mirror.apk | od -An -tx1 | tr -d ' \\n')" = "504b"
            echo "OPTIONAL CAMPUS NEXUS MIRROR VERIFIED: $mirror_size bytes."
          else
            echo "::warning::Campus Nexus mirror is not currently reachable; official signed release download remains verified."
          fi

name: Deploy CampusNexus with Digital Campus source
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: campusnexus-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and complete Digital Campus source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify student examination portal files
        run: |
          test -f studentexam.html
          test -f examlogin.html
          test -f js/student-exams.js
          test -f js/examlogin.js
          test -f css/student-exams.css
          echo "Student examination portal files are present in the Pages artifact."
      - name: Upload complete static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

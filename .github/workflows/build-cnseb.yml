name: Build and Publish Campus Nexus Secure Exam Browser

on:
  workflow_dispatch:
  push:
    paths:
      - "secure-exam-browser/**"
      - ".github/workflows/build-cnseb.yml"
    branches: [main]

permissions:
  contents: write

# Only one Secure Exam Browser build may run for a branch at a time.
# A newer push cancels the older in-progress build instead of creating
# overlapping duplicate installer builds.
concurrency:
  group: cnseb-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: secure-exam-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare official Campus Nexus brand assets
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item "../images/campus-nexus-original-logo.webp" "build/campus-nexus-original-logo.webp" -Force
          magick "../images/campus-nexus-original-logo.webp" -background none -gravity center -resize "256x256" -extent 256x256 "build/campus-nexus-icon.png"
          Add-Type -AssemblyName System.Drawing
          $source = Resolve-Path "build/campus-nexus-icon.png"
          $bitmap = [System.Drawing.Bitmap]::FromFile($source)
          $canvas = New-Object System.Drawing.Bitmap(256, 256)
          $graphics = [System.Drawing.Graphics]::FromImage($canvas)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $graphics.DrawImage($bitmap, 0, 0, 256, 256)
          $handle = $canvas.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create("build/campus-nexus.ico")
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $canvas.Dispose()
          $bitmap.Dispose()
          if ((Get-Item "build/campus-nexus.ico").Length -lt 1000) { throw "Campus Nexus icon generation failed." }
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check ../exam.js
          node --check ../platform/js/campus-nexus-dashboard-filter.js
      - name: Build Windows installer and portable app
        # Prevent electron-builder from trying to publish itself with GH_TOKEN.
        # The next step publishes the generated files using GITHUB_TOKEN.
        run: npx electron-builder --win --publish never
      - name: Prepare stable download filenames
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*-Setup-*.exe" | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter "*-Portable-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer EXE was not produced." }
          if (-not $portable) { throw "Portable EXE was not produced." }
          Copy-Item $installer.FullName "dist/Campus-Nexus-Secure-Exam-Browser-Setup.exe" -Force
          Copy-Item $portable.FullName "dist/Campus-Nexus-Secure-Exam-Browser-Portable.exe" -Force
      - name: Publish stable Windows downloads
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: cnseb-latest
          name: Campus Nexus Secure Exam Browser – Latest
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            secure-exam-browser/dist/Campus-Nexus-Secure-Exam-Browser-Setup.exe
            secure-exam-browser/dist/Campus-Nexus-Secure-Exam-Browser-Portable.exe
            secure-exam-browser/dist/latest.yml
            secure-exam-browser/dist/*.blockmap

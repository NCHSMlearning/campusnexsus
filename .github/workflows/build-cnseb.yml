name: Build Campus Nexus Secure Exam Browser

on:
  workflow_dispatch:
  push:
    paths:
      - "secure-exam-browser/**"
      - ".github/workflows/build-cnseb.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: secure-exam-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable app
        run: npm run dist:all
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: campus-nexus-secure-exam-browser-windows
          path: secure-exam-browser/dist/*
          if-no-files-found: error
          retention-days: 14

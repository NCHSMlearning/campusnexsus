name: Build Campus Nexus Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campus-nexus-app/**"
      - "campus-nexus-app-shell.js"
      - "platform/student.html"
      - "platform/login.html"
      - "examlogin.html"
      - "platform/js/campus-nexus-app-install.js"
      - "images/logo-icon.png"
      - "images/campus-nexus-original-logo.webp"
      - ".github/workflows/build-campus-nexus-app.yml"

permissions:
  contents: write

concurrency:
  group: campus-nexus-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-nexus-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run app configuration tests
        run: npm test

      - name: Create Android project
        run: npx cap add android


      - name: Install native signed-APK update installer
        run: |
          set -euo pipefail
          APP_JAVA="android/app/src/main/java/co/ke/campusnexus/app"
          mkdir -p "$APP_JAVA" android/app/src/main/res/xml
          cat > "$APP_JAVA/CampusNexusUpdaterPlugin.java" <<'JAVA'
          package co.ke.campusnexus.app;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;

          @CapacitorPlugin(name = "CampusNexusUpdater")
          public class CampusNexusUpdaterPlugin extends Plugin {
              @PluginMethod
              public void getAppInfo(PluginCall call) {
                  try {
                      PackageInfo info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                      JSObject result = new JSObject();
                      result.put("versionName", info.versionName == null ? "0.0.0" : info.versionName);
                      result.put("versionCode", Build.VERSION.SDK_INT >= 28 ? info.getLongVersionCode() : info.versionCode);
                      result.put("packageName", getContext().getPackageName());
                      call.resolve(result);
                  } catch (Exception error) { call.reject("Unable to read installed Campus Nexus version.", error); }
              }
              @PluginMethod
              public void installUpdate(PluginCall call) {
                  String source = call.getString("url");
                  String expectedSha = call.getString("sha256");
                  if (source == null || expectedSha == null || !expectedSha.matches("(?i)[a-f0-9]{64}")) {
                      call.reject("A verified update URL and SHA-256 checksum are required."); return;
                  }
                  try {
                      Uri uri = Uri.parse(source);
                      if (!"https".equalsIgnoreCase(uri.getScheme()) || !"campusnexus.co.ke".equalsIgnoreCase(uri.getHost())) {
                          call.reject("Updates must be downloaded from the official Campus Nexus website."); return;
                      }
                      if (Build.VERSION.SDK_INT >= 26 && !getContext().getPackageManager().canRequestPackageInstalls()) {
                          Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                          settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(settings);
                          JSObject result = new JSObject(); result.put("permissionRequired", true); call.resolve(result); return;
                      }
                      new Thread(() -> downloadAndOpenInstaller(source, expectedSha, call), "CampusNexus-AppUpdater").start();
                  } catch (Exception error) { call.reject("Unable to start the Campus Nexus updater.", error); }
              }
              private void downloadAndOpenInstaller(String source, String expectedSha, PluginCall call) {
                  File output = null;
                  try {
                      HttpURLConnection connection = (HttpURLConnection) new URL(source).openConnection();
                      connection.setConnectTimeout(20000); connection.setReadTimeout(60000);
                      connection.setInstanceFollowRedirects(true);
                      connection.setRequestProperty("User-Agent", "CampusNexus-Android-Updater");
                      int status = connection.getResponseCode();
                      if (status != HttpURLConnection.HTTP_OK || !"campusnexus.co.ke".equalsIgnoreCase(connection.getURL().getHost())) {
                          throw new IllegalStateException("The official update download could not be verified.");
                      }
                      File directory = getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                      if (directory == null) throw new IllegalStateException("Device download storage is unavailable.");
                      if (!directory.exists() && !directory.mkdirs()) throw new IllegalStateException("Unable to prepare update storage.");
                      output = new File(directory, "Campus-Nexus-App-update.apk");
                      MessageDigest digest = MessageDigest.getInstance("SHA-256");
                      try (InputStream input = connection.getInputStream(); FileOutputStream file = new FileOutputStream(output)) {
                          byte[] buffer = new byte[32768]; int count; long total = 0;
                          while ((count = input.read(buffer)) != -1) {
                              total += count;
                              if (total > 180L * 1024L * 1024L) throw new IllegalStateException("Update package exceeds the allowed size.");
                              digest.update(buffer, 0, count); file.write(buffer, 0, count);
                          }
                          file.getFD().sync();
                      } finally { connection.disconnect(); }
                      StringBuilder actual = new StringBuilder();
                      for (byte value : digest.digest()) actual.append(String.format("%02x", value));
                      if (!expectedSha.equalsIgnoreCase(actual.toString())) throw new SecurityException("Update checksum verification failed. The APK was not opened.");
                      Uri apkUri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", output);
                      Intent installer = new Intent(Intent.ACTION_VIEW);
                      installer.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      installer.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getContext().startActivity(installer);
                      JSObject result = new JSObject(); result.put("downloaded", true); result.put("installerOpened", true); call.resolve(result);
                  } catch (Exception error) {
                      if (output != null && output.exists()) output.delete();
                      call.reject(error.getMessage() == null ? "Campus Nexus update failed." : error.getMessage(), error);
                  }
              }
          }
          JAVA
          cat > android/app/src/main/res/xml/cn_file_paths.xml <<'XML'
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="campus_nexus_updates" path="Download/" />
          </paths>
          XML
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in xml:
              xml = xml.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          provider = """
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/cn_file_paths" />
              </provider>
          """
          if "cn_file_paths" not in xml:
              xml = xml.replace("</application>", provider + "\n</application>", 1)
          path.write_text(xml)
          if "REQUEST_INSTALL_PACKAGES" not in xml or "cn_file_paths" not in xml:
              raise SystemExit("Native updater manifest configuration failed.")
          PY
      - name: Apply explicit Android edge-to-edge system bar insets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(matches)}")
          path = matches[0]
          source = path.read_text()
          imports = """import com.getcapacitor.BridgeActivity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;"""
          source = source.replace("import com.getcapacitor.BridgeActivity;", imports)
          source = source[:source.rfind("}")]
          source += """
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(CampusNexusUpdaterPlugin.class);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(Color.parseColor("#071F3B"));
                  getWindow().setNavigationBarColor(Color.parseColor("#071F3B"));
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setBackgroundColor(Color.parseColor("#071F3B"));
                  View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (view, windowInsets) -> {
                      Insets bars = windowInsets.getInsets(
                          WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout()
                      );
                      view.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  ViewCompat.requestApplyInsets(content);
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  controller.setAppearanceLightStatusBars(false);
                  controller.setAppearanceLightNavigationBars(false);
              }
          }
          """
          path.write_text(source)
          check = path.read_text()
          for required in ("WindowInsetsCompat.Type.systemBars()", "view.setPadding(bars.left, bars.top, bars.right, bars.bottom)", "WindowInsetsCompat.CONSUMED"):
              if required not in check:
                  raise SystemExit(f"Missing required Android inset handling: {required}")
          print(f"Applied explicit system-bar padding to {path}")
          PY
      - name: Generate official Campus Nexus Android icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets www/assets
          cp ../images/campus-nexus-original-logo.webp www/assets/campus-nexus-logo.webp
          test -s www/assets/campus-nexus-logo.webp
          # Use the official high-resolution Campus Nexus emblem for the launcher icon.
          magick ../images/logo-icon.png -crop 1024x820+0+0 +repage -trim +repage -resize 820x820 -background '#062B57' -gravity center -extent 1024x1024 assets/icon-only.png
          # Keep the complete official wordmark on the launch screen.
          magick ../images/logo-icon.png -resize 1800x1800 -gravity center -background white -extent 2732x2732 assets/splash.png
          test -s assets/icon-only.png
          test -s assets/splash.png
          # Prepare official icon and splash artwork. Generate Android resources only AFTER cap sync.

      - name: Set Android application version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          gradle = path.read_text()
          marker = "    defaultConfig {"
          if marker not in gradle:
              raise SystemExit("Android defaultConfig block not found")
          gradle = gradle.replace(marker, marker + '\n        versionCode 11\n        versionName "1.2.9"', 1)
          path.write_text(gradle)
          PY
          grep -q 'versionCode 11' android/app/build.gradle
          grep -q 'versionName "1.2.9"' android/app/build.gradle

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate explicit Campus Nexus launcher icons (legacy + adaptive)
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          SOURCE="../images/logo-icon.png"
          test -s "$SOURCE"
          find "$RES" -type f -name 'ic_launcher*' -delete
          MARK="$(mktemp --suffix=.png)"
          # Crop the official blue-and-gold graduation-cap emblem, excluding the wordmark.
          magick "$SOURCE" -crop 1024x860+0+0 +repage -trim +repage -resize 270x270 "$MARK"
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values"
          magick "$MARK" -background none -gravity center -extent 432x432 "$RES/drawable/ic_launcher_foreground.png"
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <resources><color name="ic_launcher_background">#FFFFFF</color></resources>
          XML
          magick "$MARK" -resize 37x37 -background white -gravity center -extent 48x48 "$RES/mipmap-mdpi/ic_launcher.png"
          magick "$MARK" -resize 56x56 -background white -gravity center -extent 72x72 "$RES/mipmap-hdpi/ic_launcher.png"
          magick "$MARK" -resize 75x75 -background white -gravity center -extent 96x96 "$RES/mipmap-xhdpi/ic_launcher.png"
          magick "$MARK" -resize 112x112 -background white -gravity center -extent 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          magick "$MARK" -resize 150x150 -background white -gravity center -extent 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          cp "$RES/mipmap-mdpi/ic_launcher.png" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$RES/mipmap-hdpi/ic_launcher.png" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xhdpi/ic_launcher.png" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxhdpi/ic_launcher.png" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          sed -i 's|android:icon="[^"]*"|android:icon="@mipmap/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          if grep -q 'android:roundIcon=' android/app/src/main/AndroidManifest.xml; then
            sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|' android/app/src/main/AndroidManifest.xml
          else
            sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' android/app/src/main/AndroidManifest.xml
          fi
          rm -f "$MARK"
          test -s "$RES/drawable/ic_launcher_foreground.png"
          test -s "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          for f in "$RES"/mipmap-*/ic_launcher.png; do test -s "$f"; done
          echo "Verified explicit Campus Nexus emblem in legacy and adaptive Android launcher icons."
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/campus-nexus-release.keystore
          chmod 600 android/app/campus-nexus-release.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          // Campus Nexus production release signing. Credentials are injected by GitHub Actions.
          android {
              signingConfigs {
                  release {
                      storeFile file("campus-nexus-release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          cd android
          ./gradlew --no-daemon tasks --all >/dev/null
          cd ..
          rm -f android/app/campus-nexus-release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/campus-nexus-release.keystore
          chmod 600 android/app/campus-nexus-release.keystore
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.9.apk
          test -s android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.9.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.9.apk
          rm -f android/app/campus-nexus-release.keystore

      - name: Upload signed Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Nexus-App-1.2.9-Android-Release
          path: campus-nexus-app/android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.9.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: campus-nexus-app-v1.2.9
          name: Campus Nexus App 1.2.9 (Android Release)
          prerelease: false
          make_latest: true
          files: campus-nexus-app/android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.9.apk
          body: "versionCode: 11\nAndroid in-app updates with SHA-256 verification."

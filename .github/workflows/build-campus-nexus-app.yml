name: Build Campus Nexus Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campus-nexus-app/**"
      - "platform/student.html"
      - "platform/js/campus-nexus-app-install.js"
      - "images/logo-icon.png"
      - "images/campus-nexus-original-logo.webp"
      - ".github/workflows/build-campus-nexus-app.yml"

permissions:
  contents: write

concurrency:
  group: campus-nexus-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-nexus-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run app configuration tests
        run: npm test

      - name: Create Android project
        run: npx cap add android

      - name: Generate official Campus Nexus Android icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets www/assets
          cp ../images/campus-nexus-original-logo.webp www/assets/campus-nexus-logo.webp
          test -s www/assets/campus-nexus-logo.webp
          # Use the official high-resolution Campus Nexus emblem for the launcher icon.
          magick ../images/logo-icon.png -crop 1024x820+0+0 +repage -trim +repage -resize 820x820 -background '#062B57' -gravity center -extent 1024x1024 assets/icon-only.png
          # Keep the complete official wordmark on the launch screen.
          magick ../images/logo-icon.png -resize 1800x1800 -gravity center -background white -extent 2732x2732 assets/splash.png
          test -s assets/icon-only.png
          test -s assets/splash.png
          npx capacitor-assets generate --android

      - name: Set Android application version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          gradle = path.read_text()
          marker = "    defaultConfig {"
          if marker not in gradle:
              raise SystemExit("Android defaultConfig block not found")
          gradle = gradle.replace(marker, marker + '\n        versionCode 3\n        versionName "1.2.1"', 1)
          path.write_text(gradle)
          PY
          grep -q 'versionCode 3' android/app/build.gradle
          grep -q 'versionName "1.2.1"' android/app/build.gradle

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/campus-nexus-release.keystore
          chmod 600 android/app/campus-nexus-release.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          // Campus Nexus production release signing. Credentials are injected by GitHub Actions.
          android {
              signingConfigs {
                  release {
                      storeFile file("campus-nexus-release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          cd android
          ./gradlew --no-daemon tasks --all >/dev/null
          cd ..
          rm -f android/app/campus-nexus-release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/campus-nexus-release.keystore
          chmod 600 android/app/campus-nexus-release.keystore
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.1.apk
          test -s android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.1.apk
          rm -f android/app/campus-nexus-release.keystore

      - name: Upload signed Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Nexus-App-1.2.1-Android-Release
          path: campus-nexus-app/android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: campus-nexus-app-v1.2.1
          name: Campus Nexus App 1.2.1 (Android Release)
          prerelease: false
          make_latest: true
          files: campus-nexus-app/android/app/build/outputs/apk/release/Campus-Nexus-App-1.2.1.apk

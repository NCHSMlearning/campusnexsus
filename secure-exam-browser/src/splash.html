<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Nexus Secure Exam Browser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071d33;color:#fff;font-family:Segoe UI,Arial,sans-serif}
body{display:grid;place-items:center}.panel{text-align:center;padding:32px;max-width:520px}
.logo{width:92px;height:92px;object-fit:contain;background:#fff;border-radius:22px;padding:10px;box-shadow:0 12px 40px #0005}
h1{font-size:25px;margin:24px 0 8px}.sub{color:#b8c9d9;font-size:14px}.status{margin:28px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;color:#8ee0c0;font-size:13px}
.spinner{width:16px;height:16px;border:2px solid #41637e;border-top-color:#2dd4bf;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><main class="panel">
<img class="logo" src="https://campusnexus.co.ke/images/campus-nexus-original-logo.webp" alt="Campus Nexus">
<h1>Campus Nexus</h1><div class="sub">Secure Examination Browser</div>
<div class="status"><span class="spinner"></span><span>Initializing secure examination environment…</span></div>
</main></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Campus Nexus | Redirecting to sign in</title>
  <meta http-equiv="refresh" content="0;url=/platform/login.html">
  <script>
    (function () {
      var target = new URL("/platform/login.html", window.location.origin);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>Redirecting to Campus Nexus sign in…</p>
  <p><a id="login-link" href="/platform/login.html">Continue to sign in</a></p>
  <script>
    document.getElementById("login-link").href =
      "/platform/login.html" + window.location.search + window.location.hash;
  </script>
</body>
</html>

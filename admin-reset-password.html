<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset administrator password | CampusNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy:#082b50;--blue:#087cf2;--gold:#d6a33a;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef5fc,#f8fafc 55%,#eaf2fb);font-family:Inter,Arial,sans-serif;color:var(--navy)}
.card{width:min(100%,460px);background:#fff;border:1px solid #dce7f2;border-radius:22px;padding:clamp(24px,6vw,40px);box-shadow:0 22px 70px #082b5018}
.brand{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--blue)}h1{font-size:27px;letter-spacing:-.04em;margin:22px 0 8px}p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;height:48px;border:1px solid #cbd8e6;border-radius:11px;padding:0 13px;font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #087cf21c}
button{width:100%;height:49px;border:0;border-radius:11px;background:var(--navy);color:white;font:700 14px Inter;cursor:pointer;margin-top:22px}button:disabled{opacity:.55;cursor:wait}
.msg{display:none;padding:12px 14px;border-radius:10px;margin-top:16px;font-size:13px;line-height:1.5}.msg.error{display:block;background:#fff0f0;color:#a21d2b}.msg.success{display:block;background:#ecfdf3;color:#166534}.foot{text-align:center;margin-top:22px;font-size:13px}.foot a{color:var(--blue);text-decoration:none;font-weight:700}
#waiting{padding:15px;background:#f1f6fc;border-radius:12px;color:#4c6580;font-size:13px;line-height:1.6}
</style>
<script src="/code-protection.js?v=20261121-global-v4" defer></script>
</head>
<body>
<main class="card">
<div class="brand">CAMPUSNEXUS</div>
<h1>Set a new password</h1>
<p>Choose a strong password for your CampusNexus administrator account.</p>
<div id="waiting">Verifying your password-reset link. Please wait…</div>
<form id="resetForm" hidden>
<label for="password">New password</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" required placeholder="At least 12 characters">
<label for="confirmPassword">Confirm new password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required placeholder="Enter the password again">
<button id="saveButton" type="submit">Update password</button>
</form>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<div class="foot"><a href="admin-login.html">Back to administrator sign in</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://irahplkvocaakjxuisto.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5Cg5FFudf03UnmOXGNGMHQ_uK9S-uQX';
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
  });
  const form = document.getElementById('resetForm');
  const waiting = document.getElementById('waiting');
  const message = document.getElementById('message');
  const button = document.getElementById('saveButton');
  let recoveryReady = false;
  function showMessage(text, type) { message.textContent = text; message.className = 'msg ' + type; }
  function enableForm() { recoveryReady = true; waiting.hidden = true; form.hidden = false; }
  client.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) enableForm();
    if (event === 'SIGNED_OUT' && !recoveryReady) {
      waiting.textContent = 'This reset link is invalid, expired or has already been used. Request a new password-reset email from the sign-in page.';
    }
  });
  client.auth.getSession().then(({ data, error }) => {
    if (error) { waiting.textContent = 'Unable to verify this reset link. Please request a new one.'; return; }
    if (data?.session && (location.hash.includes('type=recovery') || recoveryReady)) enableForm();
    else if (!recoveryReady) waiting.textContent = 'Waiting for a valid password-reset link. If this page was opened directly, request a new link from administrator sign in.';
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!recoveryReady) return;
    const password = document.getElementById('password').value;
    const confirmation = document.getElementById('confirmPassword').value;
    if (password.length < 12) { showMessage('Use at least 12 characters for your new password.', 'error'); return; }
    if (password !== confirmation) { showMessage('The passwords do not match.', 'error'); return; }
    button.disabled = true; button.textContent = 'Updating…';
    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      showMessage('Your password has been updated. You can now sign in with the new password.', 'success');
      form.hidden = true;
      await client.auth.signOut();
    } catch (error) {
      showMessage(error?.message || 'The password could not be updated. Request a fresh reset link and try again.', 'error');
      button.disabled = false; button.textContent = 'Update password';
    }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082f49"><title>Set your password | Campus Nexus</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#082f49,#0f766e);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#102a43}.card{width:min(460px,100%);padding:30px;border-radius:22px;background:#fff;box-shadow:0 24px 70px #001a2b55}.brand{font-size:13px;font-weight:900;letter-spacing:.13em;color:#0f766e;text-transform:uppercase}h1{font-size:25px;margin:12px 0 8px;color:#082f49}.muted{font-size:14px;line-height:1.6;color:#64748b}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:800}input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;background:#0f766e;color:#fff;font-weight:800;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.notice.error{display:block;background:#fff1f2;color:#be123c}.notice.success{display:block;background:#ecfdf5;color:#047857}.loading{margin-top:18px;font-size:13px;color:#64748b}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><main class="card"><div class="brand">Campus Nexus</div><h1>Set your administrator password</h1><p class="muted">Your institution account has been created. Choose a secure password to activate your sign-in.</p>
<form id="passwordForm" hidden><label for="password">New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required placeholder="At least 10 characters"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required placeholder="Enter the password again"><button id="savePassword" type="submit">Save password</button></form>
<div id="loading" class="loading">Verifying your secure invitation…</div><div id="notice" class="notice" role="status" aria-live="polite"></div></main>
<script>(()=>{const form=document.getElementById("passwordForm"),loading=document.getElementById("loading"),notice=document.getElementById("notice"),button=document.getElementById("savePassword");const show=(m,t)=>{notice.className="notice "+t;notice.textContent=m;};const schoolCode=new URLSearchParams(location.search).get("school_code")||"";async function init(){const client=window.sb||window.supabaseClient;if(!client?.auth){loading.textContent="Unable to connect securely. Please open the invitation link again.";return;}const {data,error}=await client.auth.getSession();if(error||!data?.session){loading.textContent="";show("This invitation link is invalid, expired or already used. Ask your institution contact to send a new invitation.","error");return;}loading.textContent="";form.hidden=false;}form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirmPassword").value;if(password.length<10){show("Use at least 10 characters for your password.","error");return;}if(password!==confirm){show("The passwords do not match.","error");return;}button.disabled=true;button.textContent="Saving…";try{const client=window.sb||window.supabaseClient;const {error}=await client.auth.updateUser({password});if(error)throw error;show("Password saved. Redirecting you to sign in…","success");await client.auth.signOut({scope:"local"});setTimeout(()=>location.replace("/login"+(schoolCode?"?school_code="+encodeURIComponent(schoolCode):"")),900);}catch(error){show(error.message||"Unable to save your password. Please try again.","error");button.disabled=false;button.textContent="Save password";}});init();})();</script></body></html>
